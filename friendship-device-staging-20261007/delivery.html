<!doctype html><html lang="ja"><head><meta charset="utf-8"><base target="_top"><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#243442;font:15px/1.6 system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{font-size:25px;margin:0}h2{font-size:18px}header{display:flex;justify-content:space-between;align-items:center}.badge{background:#fff2cd;color:#71520d;padding:5px 12px;border-radius:20px}.note{font-size:13px;color:#596b78}.card{background:white;border:1px solid #dde4ea;border-radius:14px;padding:22px;margin:18px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:block;font-weight:600;margin-bottom:13px}input,select,textarea{display:block;width:100%;padding:10px;border:1px solid #c5d0d9;border-radius:7px;font:inherit;margin-top:5px}textarea{min-height:190px;resize:vertical}input[type=checkbox]{display:inline;width:auto}button{font:inherit;cursor:pointer;border:1px solid #c5d0d9;border-radius:7px;padding:9px 15px;background:white;color:#243442}button:disabled{opacity:.45;cursor:not-allowed}.tabs{display:flex;gap:0;border-bottom:2px solid #c5d0d9;flex-wrap:nowrap}.tabs [role=tab]{flex:1;min-width:0;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;padding:14px 6px;margin-bottom:-2px;color:#657681;font-weight:600;font-size:clamp(12px,2.9vw,15px)}.tabs [aria-selected=true]{background:white;color:#245f69;border-bottom-color:#245f69}.tabs [role=tab]:focus-visible{outline:2px solid #245f69;outline-offset:-3px}#panel{margin-top:0;border-top:0;border-radius:0 0 14px 14px}.actions{display:flex;gap:8px;flex-wrap:wrap}.tokens{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tokens button{font-size:12px;padding:4px 8px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit;background:#f5f8fa;border-radius:9px;padding:16px;min-height:180px}#facts{white-space:pre-wrap;font-size:13px;color:#43606b}.error{color:#a52626}#buttonPreview{background:#245f69;color:white;border-radius:6px;padding:10px;text-align:center}footer{font-size:13px;color:#657681}#workspace[hidden], [hidden]{display:none!important}@media(max-width:650px){main{padding:14px}.row{grid-template-columns:1fr}.card{padding:16px}header{align-items:start;gap:10px}}
</style></head><body><main><header><div><h1>配信管理</h1><div class="note">イベントを選び、届け方に合わせて文面を確認</div></div><span class="badge">STAGING ドラフト</span></header><section class="card"><strong>送信・予約・保存・公開は無効です</strong><div class="note">入力はこの画面のメモリ内だけに保持します。再読込すると消えます。</div><p id="status" role="status">LINE認証後、現在の運営権限を確認します。</p><button id="login" onclick="login()">LINEで認証して開く</button></section>
<div id="workspace" hidden><section class="card"><div class="row"><label>対象イベント<select id="event" onchange="loadContext(this.value)"></select></label><label>通知分類<select id="category" onchange="changeCategory(this.value)"><option value="invite">開催案内</option><option value="answer">回答催促</option><option value="eve">前日案内</option><option value="today">当日案内</option><option value="payment">入金催促</option></select></label></div><p id="source" class="note"></p><div id="facts"></div></section>
<nav class="tabs" role="tablist" aria-label="配信先"><button id="tab-reminder" role="tab" onclick="selectTab('reminder')">通知・リマインド</button><button id="tab-group" role="tab" onclick="selectTab('group')">グループ告知</button><button id="tab-news" role="tab" onclick="selectTab('news')">お知らせ</button></nav>
<section class="card" role="tabpanel" id="panel"><h2 id="tabTitle"></h2><div class="row"><div>
<div id="fields-reminder"><label>対象者条件<select id="target" onchange="saveField('target',this.value)"><option>未回答</option><option>出席者</option><option>未入金</option><option>全対象者</option></select></label><label>個別LINE<select disabled><option>個別LINE送信（接続前）</option></select></label><label>予約日時<input id="schedule" type="datetime-local" oninput="saveField('schedule',this.value)"></label><p class="note">送信可能人数：未取得 ／ 配信残量：未取得<br>対象抽出・残量照会は既存処理への接続時に対応します。</p></div>
<div id="fields-group" hidden><label>対象LINEグループ<select id="group" onchange="saveField('group',this.value)"><option value="">選択してください</option><option value="staging">STAGINGプレビュー用（実グループ未接続）</option></select></label><label><input id="showButton" type="checkbox" checked onchange="saveField('showButton',this.checked)"> ボタンを表示</label><label>ボタン名<input id="buttonLabel" value="出欠回答はこちら" oninput="saveField('buttonLabel',this.value)"></label><label>ボタンリンク<input id="buttonUrl" value="{{response_url}}" oninput="saveField('buttonUrl',this.value)"></label></div>
<div id="fields-news" hidden><label>タイトル<input id="title" oninput="saveField('title',this.value)"></label><label>一覧用概要<input id="summary" oninput="saveField('summary',this.value)"></label><div class="row"><label>公開日<input id="date" type="date" oninput="saveField('date',this.value)"></label><label>表示順<input id="order" type="number" value="0" oninput="saveField('order',this.value)"></label></div><label>公開状態<select id="published" onchange="saveField('published',this.value)"><option value="false">非公開</option><option value="true">公開</option></select></label><label><input id="showLink" type="checkbox" checked onchange="saveField('showLink',this.checked)"> 続きを読む</label></div>
<label>本文<textarea id="body" oninput="saveBody(this.value)"></textarea></label><div class="note">手入力は保持されます。分類の例文を使う場合は下のボタンで適用してください。</div><button onclick="applyExample()">現在の分類の例文を適用</button><div id="tokens" class="tokens"></div></div>
<div><h2>プレビュー</h2><div id="previewMeta" class="note"></div><h3 id="previewTitle"></h3><p id="previewSummary"></p><pre id="preview"></pre><div id="buttonPreview" hidden></div><p id="previewLink" class="note"></p><p id="warnings" class="error"></p><div class="actions"><button disabled id="action">送信無効</button><button disabled id="testSend">テスト送信</button><button disabled>下書き保存（未接続）</button></div><p class="note">既存の送信上限・排他・ログ・公開処理は、このドラフトから呼び出しません。</p></div></div></section></div><footer>既存の個別画面は従来の入口から利用できます。テンプレートなどのタブを追加できる共通構造です。</footer></main><script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script><script>
const TABS={reminder:'通知・リマインド',group:'グループ告知',news:'お知らせ'};
const EXAMPLES={invite:'{{event_name}}を開催します。\n日時：{{event_date}} {{start_time}}〜{{end_time}}\n会場：{{venue}}\n回答期限：{{response_deadline}}\n出欠回答：{{response_url}}\n{{participation_guide}}',answer:'{{event_name}}の出欠回答をお願いします。\n回答期限：{{response_deadline}}\n{{response_url}}',eve:'明日は{{event_name}}です。\n{{start_time}}開始\n{{venue}}\n{{participation_guide}}\n{{response_url}}',today:'本日は{{event_name}}です。\n{{start_time}}開始\n{{participation_guide}}\n{{response_url}}',payment:'{{event_name}}の入金確認のご案内です。\n会費：{{fee}}\n行き違いの場合はご容赦ください。'};
const GENERAL='宗心会からのお知らせです。\n';
const state={tab:'reminder',category:'invite',context:null,permissions:{},sequence:0,token:'',drafts:{}};
Object.keys(TABS).forEach(k=>state.drafts[k]={body:EXAMPLES.invite,target:'未回答',group:'',schedule:'',showButton:true,buttonLabel:'出欠回答はこちら',buttonUrl:'{{response_url}}',title:'{{event_name}}のお知らせ',summary:'',date:'',order:0,published:'false',showLink:true,edited:false});
const $=id=>document.getElementById(id);
async function rpc(id){const response=await fetch("https://script.google.com/macros/s/AKfycbzkCuCTs8dm7y2S8Q8vURbWOa8oHb3WPHgzCKWnHcLLELIu8yNtnzxjjVsKsqwfKmg/exec",{method:'POST',body:new URLSearchParams({action:'deliveryRead',idToken:state.token,eventId:id}),redirect:'follow'});const data=await response.json();if(data.ok===false||data.error)throw Error(data.error||'取得できません。');return data;}
async function login(){try{$('status').textContent='LINE認証中…';await liff.init({liffId:'2011909807-XMVcp2z3',withLoginOnExternalBrowser:false});if(!liff.isLoggedIn()){liff.login({redirectUri:location.href});return;}state.token=liff.getIDToken();if(!state.token)throw Error('LINE認証情報を取得できません。');await loadContext('');}catch(e){$('status').textContent=e.message;}}
async function loadContext(id){const sequence=++state.sequence;state.context=null;$('preview').textContent='';$('previewTitle').textContent='';$('previewSummary').textContent='';$('buttonPreview').hidden=true;$('previewLink').textContent='';$('facts').textContent='イベント情報を確認中…';$('status').textContent='権限とイベント情報を確認中…';try{const data=await rpc(id);if(sequence!==state.sequence)return;state.permissions=data.permissions;state.context=data.context;const select=$('event');select.replaceChildren();[{event_id:'',event_name:'なし／一般'},...data.events].forEach(e=>{const o=document.createElement('option');o.value=e.event_id;o.textContent=e.event_name;select.append(o)});select.value=id;$('source').textContent=data.source;Object.keys(TABS).forEach(k=>$('tab-'+k).hidden=!data.permissions[k]);if(!data.permissions[state.tab])state.tab=Object.keys(TABS).find(k=>data.permissions[k]);$('workspace').hidden=false;$('login').hidden=true;$('status').textContent='認証済み・読取専用のドラフトです。';const c=data.context;$('facts').textContent=id?[c.event_name,'開催：'+(c.event_date||'未設定')+' '+c.start_time+'〜'+c.end_time,'回答期限：'+(c.response_deadline||'未設定'),'会場：'+(c.venue||'未設定'),'回答URL：'+c.response_url,c.participation_guide].filter(Boolean).join('\n'):'一般配信：イベント固有の差し込み値は空欄です。';selectTab(state.tab);}catch(e){if(sequence!==state.sequence)return;$('facts').textContent='イベント情報を取得できません。';$('status').textContent=e.message;$('workspace').hidden=true;$('login').hidden=false;}}
function selectTab(tab){if(!state.permissions[tab])return;state.tab=tab;const d=state.drafts[tab];Object.keys(TABS).forEach(k=>{$('fields-'+k).hidden=k!==tab;$('tab-'+k).setAttribute('aria-selected',String(k===tab))});$('panel').setAttribute('aria-labelledby','tab-'+tab);$('tabTitle').textContent=TABS[tab];$('body').value=d.body;Object.keys(d).forEach(k=>{const el=$(k);if(el&&k!=='body'){if(el.type==='checkbox')el.checked=d[k];else el.value=d[k]}});$('action').textContent=tab==='news'?'公開無効':tab==='reminder'?'送信・予約無効':'送信無効';render();}
function saveField(k,v){state.drafts[state.tab][k]=v;render()}
function saveBody(value){const d=state.drafts[state.tab];d.body=value;d.edited=true;render()}
function changeCategory(value){state.category=value;render()}
function applyExample(){const d=state.drafts[state.tab];if(d.edited&&!confirm('現在のタブの本文を例文で置き換えますか？'))return;d.body=state.context?.event_id?EXAMPLES[state.category]:GENERAL;d.edited=false;$('body').value=d.body;render()}
function interpolate(text){return String(text||'').replace(/\{\{\s*([a-z_]+)\s*\}\}/g,(m,k)=>Object.prototype.hasOwnProperty.call(state.context||{},k)?state.context[k]:m)}
function render(){if(!state.context)return;const d=state.drafts[state.tab];$('preview').textContent=interpolate(d.body);$('previewTitle').textContent=state.tab==='news'?interpolate(d.title):'';$('previewSummary').textContent=state.tab==='news'?interpolate(d.summary):'';$('previewMeta').textContent=$('category').selectedOptions[0].textContent+' ／ '+(state.context.event_name||'なし／一般')+(state.tab==='news'?' ／ '+(d.published==='true'?'公開予定':'非公開')+' ／ '+d.date+' ／ 表示順 '+d.order+' ／ 続きを読む '+(d.showLink?'あり':'なし'):state.tab==='reminder'?' ／ '+d.target+' ／ '+(d.schedule||'予約なし'):'');$('buttonPreview').hidden=state.tab!=='group'||!d.showButton;$('buttonPreview').textContent=interpolate(d.buttonLabel);$('previewLink').textContent=state.tab==='group'&&d.showButton?'リンク先：'+interpolate(d.buttonUrl):'';const texts=[d.body,state.tab==='news'?d.title+' '+d.summary:state.tab==='group'?d.buttonUrl+' '+d.buttonLabel:''].join(' '),matches=[...texts.matchAll(/\{\{\s*([a-z_]+)\s*\}\}/g)].map(m=>m[1]);const missing=[...new Set(matches.filter(k=>!state.context[k]))];$('warnings').textContent=missing.length?'未設定・未対応の差し込み：'+missing.join('、'):'';}
['event_name','event_date','start_time','end_time','response_deadline','venue','fee','response_url','participation_guide','zoom_entry_url'].forEach(k=>{const b=document.createElement('button');b.textContent='{{'+k+'}}';b.onclick=()=>{const el=$('body');el.setRangeText(b.textContent,el.selectionStart,el.selectionEnd,'end');saveBody(el.value);el.focus()};$('tokens').append(b)});
</script></body></html>
